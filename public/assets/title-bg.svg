<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- 하늘 -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070d10"/>
      <stop offset="0.45" stop-color="#122027"/>
      <stop offset="0.72" stop-color="#29352f"/>
      <stop offset="1" stop-color="#3a3c32"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a6650" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#6a6650" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6a6650" stop-opacity="0"/>
    </linearGradient>

    <!-- 달 -->
    <radialGradient id="moonHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f3e6bf" stop-opacity="0.45"/>
      <stop offset="0.25" stop-color="#d9c99a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#d9c99a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonFace" cx="0.42" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#f6edcf"/>
      <stop offset="1" stop-color="#c9b886"/>
    </radialGradient>

    <!-- 가스등 -->
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf7a" stop-opacity="0.5"/>
      <stop offset="0.2" stop-color="#f0a84a" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#f0a84a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lampCone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27e" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffd27e" stop-opacity="0.03"/>
    </linearGradient>
    <radialGradient id="clockGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd890" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffd890" stop-opacity="0"/>
    </radialGradient>

    <!-- 자갈길 -->
    <pattern id="cobble" width="44" height="22" patternUnits="userSpaceOnUse">
      <rect width="44" height="22" fill="#121a1b"/>
      <rect x="1.5" y="1.5" width="19" height="9" rx="4" fill="#1f292a"/>
      <rect x="23.5" y="1.5" width="19" height="9" rx="4" fill="#1b2526"/>
      <rect x="-9.5" y="12.5" width="19" height="9" rx="4" fill="#1b2526"/>
      <rect x="12.5" y="12.5" width="19" height="9" rx="4" fill="#212c2d"/>
      <rect x="34.5" y="12.5" width="19" height="9" rx="4" fill="#1b2526"/>
    </pattern>
    <pattern id="cobbleS" xlink:href="#cobble" patternTransform="scale(0.5)"/>
    <pattern id="cobbleM" xlink:href="#cobble" patternTransform="scale(0.8)"/>
    <pattern id="cobbleL" xlink:href="#cobble" patternTransform="scale(1.3)"/>
    <linearGradient id="streetShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a332e" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#121a1b" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#05090a" stop-opacity="0.6"/>
    </linearGradient>

    <!-- 안개 -->
    <filter id="fogA" filterUnits="userSpaceOnUse" x="0" y="0" width="1600" height="1000">
      <feTurbulence type="fractalNoise" baseFrequency="0.0025 0.011" numOctaves="4" seed="7"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.78  0 0 0 0 0.76  0 0 0 0 0.66  0 0 0 1.5 -0.45"/>
    </filter>
    <filter id="fogB" filterUnits="userSpaceOnUse" x="0" y="0" width="1600" height="1000">
      <feTurbulence type="fractalNoise" baseFrequency="0.003 0.014" numOctaves="4" seed="23"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.72  0 0 0 0 0.72  0 0 0 0 0.64  0 0 0 1.6 -0.5"/>
    </filter>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000"/>
      <stop offset="0.5" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="bandLow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000"/>
      <stop offset="0.4" stop-color="#fff"/>
      <stop offset="1" stop-color="#777"/>
    </linearGradient>
    <mask id="mFar" maskUnits="userSpaceOnUse" x="0" y="0" width="1600" height="1000">
      <rect x="0" y="440" width="1600" height="300" fill="url(#band)"/>
    </mask>
    <mask id="mMid" maskUnits="userSpaceOnUse" x="0" y="0" width="1600" height="1000">
      <rect x="0" y="620" width="1600" height="220" fill="url(#band)"/>
    </mask>
    <mask id="mLow" maskUnits="userSpaceOnUse" x="0" y="0" width="1600" height="1000">
      <rect x="0" y="830" width="1600" height="170" fill="url(#bandLow)"/>
    </mask>

    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="softS"><feGaussianBlur stdDeviation="1.5"/></filter>

    <!-- 질감 & 비네팅 -->
    <filter id="grain" filterUnits="userSpaceOnUse" x="0" y="0" width="1600" height="1000">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <radialGradient id="vignette" cx="0.5" cy="0.48" r="0.75">
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.78"/>
    </radialGradient>
  </defs>

  <!-- 1. 하늘 -->
  <rect width="1600" height="1000" fill="url(#sky)"/>

  <!-- 2. 달 -->
  <circle cx="1230" cy="200" r="260" fill="url(#moonHalo)"/>
  <circle cx="1230" cy="200" r="62" fill="url(#moonFace)"/>
  <circle cx="1210" cy="188" r="11" fill="#b8a776" opacity="0.35"/>
  <circle cx="1248" cy="222" r="7" fill="#b8a776" opacity="0.3"/>
  <circle cx="1252" cy="178" r="5" fill="#b8a776" opacity="0.25"/>
  <ellipse cx="1200" cy="218" rx="190" ry="10" fill="#17242a" opacity="0.85" filter="url(#soft)"/>
  <ellipse cx="1290" cy="182" rx="120" ry="6" fill="#17242a" opacity="0.7" filter="url(#soft)"/>
  <ellipse cx="420" cy="140" rx="260" ry="14" fill="#1a282d" opacity="0.6" filter="url(#soft)"/>

  <!-- 3. 지평선 안개빛 -->
  <rect x="0" y="470" width="1600" height="280" fill="url(#horizon)"/>

  <!-- 4. 원경: 빅벤 · 국회의사당 · 세인트폴 -->
  <g fill="#21302f">
    <path d="M0,700 L0,575 L30,575 L30,555 L36,555 L36,575 L80,575 L110,548 L140,575 L190,575 L190,540 L198,540 L198,528 L206,528 L206,540 L214,540 L214,575 L260,575 L260,560 L300,560 L300,590 L345,590 L345,700 Z"/>
    <!-- 엘리자베스 타워 -->
    <rect x="345" y="330" width="70" height="370"/>
    <rect x="335" y="248" width="90" height="86"/>
    <rect x="343" y="208" width="74" height="42"/>
    <polygon points="339,210 351,186 364,176 380,98 396,176 409,186 421,210"/>
    <polygon points="331,250 336,228 341,250"/>
    <polygon points="419,250 424,228 429,250"/>
    <!-- 국회의사당 -->
    <path d="M415,700 L415,595 L425,595 L425,575 L430,563 L435,575 L435,595 L470,595 L470,582 L476,570 L482,582 L482,595 L520,595 L520,580 L526,568 L532,580 L532,595 L570,595 L570,582 L576,570 L582,582 L582,595 L620,595 L620,580 L626,568 L632,580 L632,595 L670,595 L670,560 L680,543 L690,560 L690,595 L720,595 L720,700 Z"/>
    <path d="M720,700 L720,600 L780,600 L800,585 L840,585 L860,600 L940,600 L940,700 Z"/>
    <!-- 세인트폴 대성당 -->
    <rect x="935" y="540" width="230" height="160"/>
    <rect x="945" y="500" width="30" height="45"/>
    <polygon points="945,500 960,468 975,500"/>
    <rect x="1125" y="500" width="30" height="45"/>
    <polygon points="1125,500 1140,468 1155,500"/>
    <rect x="990" y="470" width="120" height="75"/>
    <path d="M980,478 C980,400 1015,365 1050,362 C1085,365 1120,400 1120,478 Z"/>
    <rect x="1041" y="330" width="18" height="36"/>
    <path d="M1038,332 Q1050,316 1062,332 Z"/>
    <circle cx="1050" cy="313" r="5"/>
    <path d="M1165,700 L1165,590 L1220,590 L1220,570 L1228,570 L1228,590 L1280,590 L1310,565 L1340,590 L1400,590 L1400,555 L1408,555 L1408,590 L1460,590 L1490,570 L1520,590 L1600,590 L1600,700 Z"/>
  </g>
  <line x1="380" y1="98" x2="380" y2="70" stroke="#21302f" stroke-width="2"/>
  <line x1="1050" y1="296" x2="1050" y2="310" stroke="#21302f" stroke-width="2"/>
  <line x1="1044" y1="301" x2="1056" y2="301" stroke="#21302f" stroke-width="2"/>
  <!-- 빅벤 시계 -->
  <circle cx="380" cy="291" r="55" fill="url(#clockGlow)"/>
  <circle cx="380" cy="291" r="29" fill="#cdb27a" opacity="0.55"/>
  <circle cx="380" cy="291" r="29" fill="none" stroke="#21302f" stroke-width="2.5"/>
  <line x1="380" y1="291" x2="380" y2="270" stroke="#21302f" stroke-width="2.5"/>
  <line x1="380" y1="291" x2="394" y2="297" stroke="#21302f" stroke-width="2.5"/>
  <g fill="#182423">
    <rect x="352" y="216" width="10" height="26" rx="5"/>
    <rect x="375" y="216" width="10" height="26" rx="5"/>
    <rect x="398" y="216" width="10" height="26" rx="5"/>
  </g>

  <!-- 5. 원경 안개 -->
  <rect width="1600" height="1000" filter="url(#fogA)" mask="url(#mFar)" opacity="0.6"/>

  <!-- 6. 중경: 굴뚝 지붕들 -->
  <path fill="#131c1e" d="M0,1000 L0,640 L70,640 L70,612 L76,612 L76,600 L84,600 L84,612 L92,612 L92,600 L100,600 L100,612 L108,612 L108,640 L150,640 L190,605 L230,640 L280,640 L280,620 L340,620 L340,598 L346,598 L346,588 L354,588 L354,598 L362,598 L362,588 L370,588 L370,598 L378,598 L378,620 L440,620 L470,598 L540,598 L570,620 L620,620 L620,650 L700,650 L700,628 L706,628 L706,616 L714,616 L714,628 L722,628 L722,616 L730,616 L730,628 L738,628 L738,650 L800,650 L830,625 L860,650 L920,650 L920,630 L990,630 L990,606 L996,606 L996,594 L1004,594 L1004,606 L1012,606 L1012,594 L1020,594 L1020,606 L1028,606 L1028,630 L1090,630 L1120,604 L1150,630 L1185,630 L1185,525 L1192,525 L1200,430 L1208,525 L1215,525 L1215,630 L1270,630 L1270,612 L1330,612 L1330,640 L1420,640 L1450,612 L1480,640 L1520,640 L1520,618 L1526,618 L1526,606 L1534,606 L1534,618 L1542,618 L1542,606 L1550,606 L1550,618 L1558,618 L1558,640 L1600,640 L1600,1000 Z"/>
  <g fill="#d89a4a">
    <rect x="160" y="672" width="10" height="14" opacity="0.5"/>
    <rect x="452" y="662" width="10" height="14" opacity="0.4"/>
    <rect x="760" y="690" width="10" height="14" opacity="0.35"/>
    <rect x="1062" y="668" width="10" height="14" opacity="0.45"/>
    <rect x="1196" y="560" width="8" height="16" opacity="0.4"/>
    <rect x="1500" y="680" width="10" height="14" opacity="0.5"/>
  </g>

  <!-- 7. 중경 안개 -->
  <rect width="1600" height="1000" filter="url(#fogB)" mask="url(#mMid)" opacity="0.5"/>

  <!-- 8. 자갈길 -->
  <rect x="0" y="782" width="1600" height="10" fill="#2a3330"/>
  <rect x="0" y="792" width="1600" height="60" fill="url(#cobbleS)"/>
  <rect x="0" y="852" width="1600" height="70" fill="url(#cobbleM)"/>
  <rect x="0" y="922" width="1600" height="78" fill="url(#cobbleL)"/>
  <rect x="0" y="782" width="1600" height="218" fill="url(#streetShade)"/>
  <!-- 젖은 노면 반사 -->
  <ellipse cx="1320" cy="950" rx="32" ry="60" fill="#f0b862" opacity="0.2" filter="url(#soft)"/>
  <ellipse cx="173" cy="955" rx="18" ry="40" fill="#e2a654" opacity="0.12" filter="url(#soft)"/>

  <!-- 9. 근경: 좌측 건물 (221B) -->
  <path fill="#0a0f11" d="M0,1000 L0,300 L120,300 L120,268 L130,268 L130,255 L140,255 L140,268 L150,268 L150,255 L160,255 L160,268 L170,268 L170,300 L215,300 L265,360 L265,930 L250,930 L250,1000 Z"/>
  <rect x="0" y="372" width="265" height="6" fill="#141c1e"/>
  <g>
    <rect x="40" y="400" width="46" height="72" fill="#141c1f"/>
    <rect x="150" y="400" width="46" height="72" fill="#e2a654" opacity="0.75"/>
    <rect x="40" y="520" width="46" height="72" fill="#141c1f"/>
    <rect x="150" y="520" width="46" height="72" fill="#141c1f"/>
    <rect x="40" y="640" width="46" height="72" fill="#e2a654" opacity="0.6"/>
    <rect x="150" y="640" width="46" height="72" fill="#141c1f"/>
  </g>
  <g stroke="#0a0f11" stroke-width="3">
    <line x1="173" y1="400" x2="173" y2="472"/><line x1="150" y1="436" x2="196" y2="436"/>
    <line x1="63" y1="640" x2="63" y2="712"/><line x1="40" y1="676" x2="86" y2="676"/>
  </g>
  <rect x="170" y="820" width="55" height="110" fill="#111a1c"/>
  <path d="M170,820 A27.5,27.5 0 0 1 225,820 Z" fill="#e2a654" opacity="0.5"/>
  <text x="197.5" y="868" font-family="Georgia, serif" font-size="11" fill="#c9a25a" text-anchor="middle" letter-spacing="1">221B</text>

  <!-- 10. 근경: 우측 건물 -->
  <path fill="#0a0f11" d="M1600,1000 L1600,330 L1566,330 L1566,300 L1556,300 L1556,288 L1548,288 L1548,300 L1538,300 L1538,288 L1530,288 L1530,300 L1520,300 L1520,330 L1480,330 L1420,390 L1420,940 L1440,940 L1440,1000 Z"/>
  <g>
    <rect x="1460" y="430" width="44" height="70" fill="#141c1f"/>
    <rect x="1540" y="430" width="44" height="70" fill="#141c1f"/>
    <rect x="1460" y="550" width="44" height="70" fill="#e2a654" opacity="0.55"/>
    <rect x="1540" y="550" width="44" height="70" fill="#141c1f"/>
    <rect x="1460" y="670" width="44" height="70" fill="#141c1f"/>
    <rect x="1540" y="670" width="44" height="70" fill="#141c1f"/>
  </g>
  <g stroke="#0a0f11" stroke-width="3">
    <line x1="1482" y1="550" x2="1482" y2="620"/><line x1="1460" y1="585" x2="1504" y2="585"/>
  </g>

  <!-- 11. 가스등 -->
  <circle cx="1320" cy="595" r="250" fill="url(#lampGlow)"/>
  <polygon points="1308,622 1332,622 1470,930 1170,930" fill="url(#lampCone)"/>
  <rect x="1316" y="620" width="8" height="290" fill="#070b0c"/>
  <rect x="1300" y="628" width="40" height="4" fill="#070b0c"/>
  <path d="M1306,910 L1334,910 L1330,893 L1310,893 Z" fill="#070b0c"/>
  <polygon points="1300,580 1340,580 1332,622 1308,622" fill="#ffd88a"/>
  <g stroke="#070b0c" stroke-width="2.5" fill="none">
    <polygon points="1300,580 1340,580 1332,622 1308,622"/>
    <line x1="1320" y1="580" x2="1320" y2="622"/>
  </g>
  <polygon points="1294,581 1320,556 1346,581" fill="#070b0c"/>
  <circle cx="1320" cy="552" r="4" fill="#070b0c"/>

  <!-- 12. 탐정 실루엣 -->
  <polygon points="1228,906 1254,906 1176,926 1136,926" fill="#000" opacity="0.4"/>
  <g fill="#050809">
    <circle cx="1240" cy="822" r="8.5"/>
    <path d="M1229,820 Q1240,805 1251,820 Z"/>
    <path d="M1223,819 L1258,819 L1255,824 L1226,824 Z"/>
    <path d="M1231,830 L1249,830 L1264,872 L1216,872 Z"/>
    <path d="M1222,870 L1258,870 L1254,896 L1226,896 Z"/>
    <rect x="1229" y="895" width="8" height="11"/>
    <rect x="1243" y="895" width="8" height="11"/>
    <path d="M1247,826 L1256,828 L1256,822 L1261,822 L1261,830 L1247,829 Z"/>
  </g>
  <path d="M1258,818 C1252,806 1267,798 1259,786 C1253,776 1265,768 1261,756" fill="none" stroke="#c9c2a4" stroke-width="2" opacity="0.28" filter="url(#softS)"/>

  <!-- 13. 바닥 안개 -->
  <rect width="1600" height="1000" filter="url(#fogA)" mask="url(#mLow)" opacity="0.32"/>

  <!-- 14. 비네팅 & 필름 그레인 -->
  <rect width="1600" height="1000" fill="url(#vignette)"/>
  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.07"/>
</svg>
